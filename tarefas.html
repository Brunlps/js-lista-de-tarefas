<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<title>ToDo List</title>
</head>

<body class="bg-gray-100">

     <header class="flex items-center py-4 px-15 bg-gradient-to-r from-purple-900 via-purple-600 to-purple-900">
        <input onkeyup="filtrarTarefas(event.target.value)" type="text" placeholder="Pesquisar" class="w-100 h-10 pl-4 mx-2 rounded bg-white"/>
        
        <button class="leading-10 bg-purple-800 rounded px-4 font-bold text-white duration-200 cursor-pointer hover:bg-purple-400 hover:text-black">Buscar Tarefa</button>
    </header>

    <div class="min-h-screen flex items-start justify-center pt-20 bg-gray-200">
        <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md" id="form-tarefa">

            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Lista De Tarefas</h1>

            <form id="" class="flex gap-2 mb-6">

                <input onchange="criarTarefa(event.target.value)" type="text" id="input-tarefa" placeholder="Digite uma tarefa" class="flex-1 border border-x-gray-300 rounded-lg px-4 focus:outline-none focus:border-blue-500"/>

                <button type="submit" class="bg-blue-500 text-white px-4 py-2
                rounded-lg p-2 hover:border-blue-600 cursor-pointer">Adicionar</button>
            </form>
            <ul id="lista-tarefas" class="space-y-2"></ul>
        </div>
    </div>
    
</body>

</html>
